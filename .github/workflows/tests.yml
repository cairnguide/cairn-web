# Shared test jobs, called by the pull-request workflow (and unit tests by branch-push).
name: Tests

on:
  workflow_call:
    inputs:
      use-cases:
        description: Also run the browser use case tests.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage thresholds
        run: npm run test:unit

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| Metric | % |\n|---|---|\n' + ['lines','statements','functions','branches'].map(k => '| ' + k + ' | ' + t[k].pct + ' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (client and Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the client
        run: npm run build

      - name: Bundle the Worker without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir dist/worker

  use-cases:
    name: Use case tests (browser)
    if: inputs.use-cases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Use case, security, and accessibility tests
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
